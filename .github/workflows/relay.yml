name: Relay

on:
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relay

jobs:
  linux:
    name: Linux — core, adapters, runner
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Runner smoke tests (simulation only; no network)
        run: |
          BIN="$(swift build --show-bin-path)/relay-runner"
          "$BIN" wybe-sim --shifts 3 --faults harsh | tee sim.log
          grep -q "SIMULATED average" sim.log
          set +e; "$BIN" wybe-live; status=$?; set -e
          test "$status" -eq 2
          ./scripts/demo-warehouse.sh | tee warehouse.log
          grep -q "Escalation: How do I handle frozen goods?" warehouse.log
      - name: No credentials in tracked files
        run: ./scripts/check-no-secrets.sh

  macos:
    name: macOS — includes SwiftUI app target
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (core, adapters, runner and the Relay app)
        run: swift build
      - name: Test
        run: swift test
      - name: Build Relay.app bundle
        run: ./scripts/build-app.sh
      # Window captures of the built app, for checking the look without a Mac. Download them from the
      # run's Artifacts. Not a test: a capture problem doesn't fail the job.
      - name: Screenshots
        continue-on-error: true
        env:
          WINDOW_ID: ${{ runner.temp }}/window-id
        run: |
          swiftc -O ../.github/scripts/window-id.swift -o "$WINDOW_ID"
          mkdir -p screenshots
          shot() { ../.github/scripts/app-screenshot.sh build/Relay.app "screenshots/$1.png" "${@:2}"; }
          n=1
          for section in assistant tasks training wybe activity settings; do
            shot "$(printf %02d $n)-$section" --screenshot-section "$section"
            n=$((n + 1))
          done
          shot 07-settings-light --screenshot-section settings -appearance Light
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-screenshots
          path: relay/screenshots/
          if-no-files-found: warn
          retention-days: 14
