name: Relay

on:
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relay

jobs:
  linux:
    name: Linux — core, adapters, runner
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Runner smoke tests (simulation only; no network)
        run: |
          BIN="$(swift build --show-bin-path)/relay-runner"
          "$BIN" wybe-sim --shifts 3 --faults harsh | tee sim.log
          grep -q "SIMULATED average" sim.log
          set +e; "$BIN" wybe-live; status=$?; set -e
          test "$status" -eq 2
          ./scripts/demo-warehouse.sh | tee warehouse.log
          grep -q "Escalation: How do I handle frozen goods?" warehouse.log
      - name: No credentials in tracked files
        run: ./scripts/check-no-secrets.sh

  macos:
    name: macOS — includes SwiftUI app target
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (core, adapters, runner and the Relay app)
        run: swift build
      - name: Test
        run: swift test
      - name: Build Relay.app bundle
        run: ./scripts/build-app.sh
      - name: Capture screenshots of the running app
        run: |
          shots="$PWD/build/screenshots"
          mkdir -p "$shots"
          # Snapshot mode: the app shows every section at normal and minimum size, renders its own
          # window to PNG (no screen-recording permission needed), writes manifest.md and quits.
          DS_SNAPSHOT_DIR="$shots" "build/Relay.app/Contents/MacOS/Relay" &
          pid=$!
          sleep 10
          # Best effort: a system screenshot of the whole runner screen. Without Screen Recording
          # permission macOS returns only the desktop, so this file is labelled and may show no app.
          screencapture -x "$shots/system-screen-best-effort.png" || echo "system screencapture unavailable"
          for _ in $(seq 1 150); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Relay did not finish its captures in time" >&2
            kill "$pid"; exit 1
          fi
          wait "$pid"
          ls -la "$shots"
          cat "$shots/manifest.md"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-screenshots
          path: relay/build/screenshots
          if-no-files-found: warn
          retention-days: 14
