name: Distil

on:
  pull_request:
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
  push:
    branches: [main]
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distil-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: distil

jobs:
  linux:
    name: Linux — core engine and tests
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: macOS — includes SwiftUI app target
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (core and the Distil app)
        run: swift build
      - name: Test
        run: swift test
      - name: Build Distil.app bundle
        run: SKIP_TESTS=1 bash scripts/build-macos.sh
      - name: Capture screenshots of the running app
        run: |
          shots="$PWD/build/screenshots"
          mkdir -p "$shots"
          # Snapshot mode: the app shows every section at normal and minimum size, renders its own
          # window to PNG (no screen-recording permission needed), writes manifest.md and quits.
          DS_SNAPSHOT_DIR="$shots" "dist/Distil.app/Contents/MacOS/Distil" &
          pid=$!
          sleep 10
          # Best effort: a system screenshot of the whole runner screen. Without Screen Recording
          # permission macOS returns only the desktop, so this file is labelled and may show no app.
          screencapture -x "$shots/system-screen-best-effort.png" || echo "system screencapture unavailable"
          for _ in $(seq 1 150); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Distil did not finish its captures in time" >&2
            kill "$pid"; exit 1
          fi
          wait "$pid"
          ls -la "$shots"
          cat "$shots/manifest.md"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distil-screenshots
          path: distil/build/screenshots
          if-no-files-found: warn
          retention-days: 14
