name: Distil

on:
  pull_request:
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distil-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: distil

jobs:
  linux:
    name: Linux — core engine and tests
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: swift --version
      - name: Tests (source build, test compilation, test run)
        run: scripts/test.sh

  macos:
    name: macOS — tests, Distil.app package, launch check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites (toolchain, SDK, XCTest)
        id: prereq
        run: scripts/check-prerequisites.sh test
      - name: Tests (source build, test compilation, test run)
        id: tests
        run: scripts/test.sh
      # Packaging compiles only the Distil product, never the tests, so it runs even if a test failed.
      - name: Package Distil.app (release, ad hoc signed)
        id: package
        if: ${{ !cancelled() }}
        run: scripts/package.sh
      - name: Launch check (opens the packaged app with --self-check)
        id: launch
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          scripts/verify-launch.sh
          cat dist/logs/launch-report.json
      - name: Zip Distil.app for download
        id: zip
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          name="Distil-$(git rev-parse --short HEAD)-macos-$(uname -m)"
          mkdir -p upload
          ditto -c -k --sequesterRsrc --keepParent dist/Distil.app "upload/$name.zip"
          cp dist/logs/launch-report.json upload/ 2>/dev/null || true
          (cd upload && shasum -a 256 "$name.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Round trip: the zipped app must unpack with a valid signature.
          mkdir -p "$RUNNER_TEMP/unzip" && ditto -x -k "upload/$name.zip" "$RUNNER_TEMP/unzip"
          codesign --verify --strict --verbose=1 "$RUNNER_TEMP/unzip/Distil.app"
      # Unsigned-by-Apple development build (ad hoc signature): a CI artifact, not a release.
      - name: Upload Distil.app
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: distil-app-macos
          path: distil/upload/
          retention-days: 14
      # Window captures of the built app, for checking the look without a Mac. Download them from the
      # run's Artifacts. Not a test: a capture problem doesn't fail the job.
      - name: Screenshots
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        env:
          WINDOW_ID: ${{ runner.temp }}/window-id
        run: |
          swiftc -O ../.github/scripts/window-id.swift -o "$WINDOW_ID"
          mkdir -p screenshots
          shot() { ../.github/scripts/app-screenshot.sh dist/Distil.app "screenshots/$1.png" "${@:2}"; }
          shot 01-overview-empty-project
          n=2
          for section in overview workspace comparison library experiments settings; do
            shot "$(printf %02d $n)-$section-demo" --screenshot-demo pastedNotes --screenshot-section "$section"
            n=$((n + 1))
          done
          shot 08-workspace-demo-light --screenshot-demo pastedNotes --screenshot-section workspace -appearance Light
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distil-screenshots
          path: distil/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          {
            echo "### Distil: macOS results ($(git rev-parse --short HEAD))"
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| Prerequisites | ${{ steps.prereq.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| App build and packaging | ${{ steps.package.outcome }} |"
            echo "| Launch check | ${{ steps.launch.outcome }} |"
            echo "| Downloadable app (artifact distil-app-macos) | ${{ steps.zip.outcome }} |"
            grep -h 'Executed [0-9]* tests' dist/logs/test.log 2>/dev/null | tail -1 | sed 's/^[[:space:]]*/Tests: /'
          } >> "$GITHUB_STEP_SUMMARY"
