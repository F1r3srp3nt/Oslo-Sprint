name: Distil

on:
  pull_request:
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "distil/**"
      - ".github/workflows/distil.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distil-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: distil

jobs:
  linux:
    name: Linux — core engine and tests
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: macOS — includes SwiftUI app target
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (core and the Distil app)
        run: swift build
      - name: Test
        run: swift test
      - name: Build Distil.app bundle
        run: SKIP_TESTS=1 bash scripts/build-macos.sh
      # Window captures of the built app, for checking the look without a Mac. Download them from the
      # run's Artifacts. Not a test: a capture problem doesn't fail the job.
      - name: Screenshots
        continue-on-error: true
        env:
          WINDOW_ID: ${{ runner.temp }}/window-id
        run: |
          swiftc -O ../.github/scripts/window-id.swift -o "$WINDOW_ID"
          mkdir -p screenshots
          shot() { ../.github/scripts/app-screenshot.sh dist/Distil.app "screenshots/$1.png" "${@:2}"; }
          shot 01-overview-empty-project
          n=2
          for section in overview workspace comparison library experiments settings; do
            shot "$(printf %02d $n)-$section-demo" --screenshot-demo pastedNotes --screenshot-section "$section"
            n=$((n + 1))
          done
          shot 08-workspace-demo-light --screenshot-demo pastedNotes --screenshot-section workspace -appearance Light
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distil-screenshots
          path: distil/screenshots/
          if-no-files-found: warn
          retention-days: 14
