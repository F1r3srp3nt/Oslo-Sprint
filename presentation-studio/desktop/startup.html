<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-REPLACED_AT_BUILD'" />
    <title>Presentation Studio</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060d1c; color: #e6f1ff; font: 14px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .card { max-width: 560px; background: #0e1c3a; border: 1px solid #1f3561; border-radius: 16px; padding: 28px; }
      h1 { margin: 0 0 6px; font-size: 20px; }
      .logo { color: #22d3ee; font-size: 26px; }
      .error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.35); color: #fecaca; border-radius: 8px; padding: 10px 12px; margin: 14px 0; white-space: pre-wrap; word-break: break-word; }
      .muted { color: #7489ab; font-size: 13px; }
      button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid #1f3561; background: #132447; color: #e6f1ff; cursor: pointer; margin-right: 8px; }
      button.primary { background: #22d3ee; color: #03121f; border-color: transparent; }
      code { font-size: 12px; background: #172a50; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="logo" aria-hidden="true">◆</div>
      <h1>Presentation Studio could not start</h1>
      <div class="error" id="error">Unknown error.</div>
      <p class="muted">Try again. If it keeps failing, quit and reopen the app. Details are in the log: <code id="log"></code></p>
      <button class="primary" id="retry">Try again</button>
      <button id="logs">Show log</button>
      <button id="quit">Quit</button>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      document.getElementById('error').textContent = q.get('error') || 'Unknown error.';
      document.getElementById('log').textContent = q.get('log') || '';
      const d = window.studioDesktop;
      document.getElementById('retry').onclick = () => d && d.retryStartup();
      document.getElementById('logs').onclick = () => d && d.showLogs();
      document.getElementById('quit').onclick = () => d && d.quit();
    </script>
  </body>
</html>
